name: CI

on:
  push:
    branches: [main, "perf/**", "release/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Formatting and fatal-warning policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Check all maintained Scala and build sources
        run: sbt formatCheck
      - name: Compile with fatal compiler warnings
        run: sbt coreJVM/compile coreJS/compile

  test:
    name: Tests (Scala 3.7.4, ${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [JVM, JS]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run ${{ matrix.platform }} tests
        run: sbt -v "core${{ matrix.platform }}/test" "laws${{ matrix.platform }}/test"

  coverage-jvm:
    name: JVM coverage report (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Run the core JVM suite with coverage instrumentation
        run: sbt coverageJVM
      - name: Retain HTML, XML, and Cobertura reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gale-jvm-coverage
          path: |
            core/jvm/target/scala-3.7.4/scoverage-report
            core/jvm/target/scala-3.7.4/coverage-report
          if-no-files-found: warn
          retention-days: 14

  compatibility:
    name: MiMa and TASTy-MiMa baseline (pre-M1 advisory)
    runs-on: ubuntu-latest
    # M1 creates the first immutable baseline. The build already wires both
    # tools; this job becomes blocking and receives
    # -Dgale.compatibility.baseline=0.1.0-M1 immediately after publication.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Exercise admitted-artifact compatibility tasks
        run: sbt compatibilityCheck

  docs:
    name: Scaladoc and executable guides
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Compile API docs and render the guide site
        run: sbt docsCheck

  scala-next-consumer:
    name: Scala 3.8.4 consumer probe
    runs-on: ubuntu-latest
    # TASTy/API compatibility evidence is advisory until M1 publishes the first
    # immutable baseline; it remains visible and never masks required release
    # jobs.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile the dedicated downstream consumer
        run: sbt scalaNextConsumerProbe

  scala-next-source:
    name: Scala Next source experiment (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Compile and test Gale source on Scala 3.8.4
        run: sbt "++3.8.4!" testAll

  full-link:
    name: Scala.js optimized links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run the complete JVM/JS suite and full links
        run: sbt testAllFull

  breeze-interop:
    name: Breeze parity and published interop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Run Breeze differential parity and conversion suites
        run: sbt parityTest interopBreezeTest
      - name: Compile a clean consumer against the published local POM
        run: sbt publishedInteropProbe

  release-dependencies:
    name: Release dependency manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Reject prohibited snapshot dependencies
        run: sbt releaseDependencyCheck

  bench:
    name: Benchmarks compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Compile JVM (JMH) and JS benchmarks
        run: sbt benchCompile

  vector-backend:
    name: Vector backend (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Test Vector API backend
        run: sbt vectorBackendTest
      # The bench job already compiles the JMH benchmarks on JDK 21; only the JDK 22
      # leg adds coverage here.
      - name: Compile the JMH crossover benchmark (JDK 22)
        if: matrix.java == '22'
        run: sbt benchCompile

  ffm-blas-backend:
    name: FFM BLAS/LAPACK backend (JDK 22 / OpenBLAS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "22"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Install OpenBLAS CBLAS runtime
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev
      - name: Test native storage and FFM BLAS/LAPACK conformance
        run: sbt nativeBackendTest blasFfmBackendTest benchFfmCompile

  wasm:
    name: WebAssembly tests and profile (experimental)
    runs-on: ubuntu-latest
    # Optional/allow-failure: the experimental Wasm backend must not gate CI.
    continue-on-error: true
    env:
      GALE_WASM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Execute core tests and optimized kernel profile as WebAssembly
        # build.sbt supplies --experimental-wasm-exnref to the Node jsEnv.
        run: sbt coreJS/test benchSmokeJSFull
