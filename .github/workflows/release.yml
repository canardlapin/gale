name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and inspect an unsigned bundle without uploading it"
        required: true
        default: true
        type: boolean
      candidate_version:
        description: "Synthetic 0.1 milestone or RC version used only by a manual dry run"
        required: true
        default: "0.1.0-M1"
        type: string

permissions:
  contents: read

jobs:
  qualification:
    uses: ./.github/workflows/ci.yml

  preflight:
    name: Release preflight
    needs: qualification
    if: github.event_name == 'push' || inputs.dry_run == true
    runs-on: ubuntu-latest
    env:
      DRY_RUN_VERSION: ${{ inputs.candidate_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require a semantic release tag
        if: github.event_name == 'push'
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v0\.1\.[0-9]+(-(M|RC)[1-9][0-9]*)?$ ]]; then
            echo "Gale 0.1 releases require v0.1.x, v0.1.x-Mn, or v0.1.x-RCn; got $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Validate the synthetic dry-run version
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ ! "$DRY_RUN_VERSION" =~ ^0\.1\.[0-9]+-(M|RC)[1-9][0-9]*$ ]]; then
            echo "Manual dry runs require a 0.1 milestone or RC version; got $DRY_RUN_VERSION" >&2
            exit 1
          fi
      - name: Run the tag-derived release preflight
        if: github.event_name == 'push'
        run: sbt releaseM1Preflight
      - name: Run the synthetic dry-run preflight
        if: github.event_name == 'workflow_dispatch'
        run: sbt "set ThisBuild / version := \"$DRY_RUN_VERSION\"" releaseM1Preflight
      - name: Re-run the complete correctness, optimized-link, and docs gates
        run: sbt testAllFull docsCheck

  package:
    name: Stage Gale 0.1 artifacts
    needs: preflight
    runs-on: ubuntu-latest
    env:
      DRY_RUN_VERSION: ${{ inputs.candidate_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Import the ephemeral signing key
        if: github.event_name == 'push'
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
        run: printf '%s' "$PGP_SECRET" | base64 --decode | gpg --batch --import
      - name: Export the expected public signing key
        if: github.event_name == 'push'
        env:
          RELEASE_PGP_FINGERPRINT: ${{ vars.RELEASE_PGP_FINGERPRINT }}
        run: |
          test -n "$RELEASE_PGP_FINGERPRINT"
          mkdir -p target
          gpg --batch --armor --export "$RELEASE_PGP_FINGERPRINT" > target/release-public-key.asc
          test -s target/release-public-key.asc
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: release-public-key
          path: target/release-public-key.asc
          if-no-files-found: error
      - name: Stage the signed JDK 21 publication slice
        if: github.event_name == 'push'
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: sbt releaseM1Signed
      - name: Stage an unsigned dry-run bundle
        if: github.event_name == 'workflow_dispatch'
        run: sbt "set ThisBuild / version := \"$DRY_RUN_VERSION\"" releaseM1Unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: central-staging
          path: target/sona-staging
          if-no-files-found: error

  assemble-and-upload:
    name: Validate one Central Portal bundle
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: central-staging
          path: target/central-staging
      - name: Assemble the Central bundle
        run: |
          mkdir -p target/central-bundle-tree
          cp -R target/central-staging/. target/central-bundle-tree/
          (cd target/central-bundle-tree && zip -X -q -r ../central-bundle.zip .)
      - uses: actions/download-artifact@v4
        if: github.event_name == 'push'
        with:
          name: release-public-key
          path: target
      - name: Verify the complete Maven layout and admitted coordinates
        env:
          RELEASE_PGP_FINGERPRINT: ${{ vars.RELEASE_PGP_FINGERPRINT }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tools/verify-central-bundle.sh --require-signatures --public-key target/release-public-key.asc --expected-fingerprint "$RELEASE_PGP_FINGERPRINT" target/central-bundle.zip
          else
            tools/verify-central-bundle.sh target/central-bundle.zip
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Consume all four staged coordinates on JVM and optimized Scala.js
        env:
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
        run: |
          version="$CANDIDATE_VERSION"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then version="${GITHUB_REF_NAME#v}"; fi
          repository="$GITHUB_WORKSPACE/target/central-bundle-tree"
          cd compat/release-consumer
          sbt "-Dgale.release.repository=$repository" "-Dgale.release.version=$version" testRelease
      - name: Upload as a user-managed Central Portal deployment
        if: github.event_name == 'push'
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          token=$(printf '%s:%s' "$SONATYPE_USERNAME" "$SONATYPE_PASSWORD" | base64 | tr -d '\n')
          url="https://central.sonatype.com/api/v1/publisher/upload?name=Gale-${GITHUB_REF_NAME}&publishingType=USER_MANAGED"
          deployment=$(curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer $token" \
            --form "bundle=@target/central-bundle.zip" \
            "$url")
          {
            echo "### Central Portal deployment"
            echo "Uploaded in USER_MANAGED mode; publish it manually after Central validation."
            echo
            printf 'Deployment ID: `%s`\n' "$deployment"
          } >> "$GITHUB_STEP_SUMMARY"
          for attempt in $(seq 1 30); do
            curl --fail-with-body --silent --show-error --request POST \
              --header "Authorization: Bearer $token" \
              "https://central.sonatype.com/api/v1/publisher/status?id=$deployment" \
              > target/central-validation.json
            state=$(jq -r '.deploymentState' target/central-validation.json)
            if [[ "$state" == "VALIDATED" ]]; then
              echo "Central validation passed; deployment remains unpublished." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ "$state" != "PENDING" && "$state" != "VALIDATING" ]]; then
              cat target/central-validation.json
              echo "Unexpected Central state: $state" >&2
              exit 1
            fi
            sleep 10
          done
          echo "Central validation did not finish within five minutes; inspect the deployment ID above." >&2
          exit 1
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'push'
        with:
          name: central-validation
          path: target/central-validation.json
