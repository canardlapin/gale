name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and inspect an unsigned bundle without uploading it"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  preflight:
    name: Release preflight
    if: github.event_name == 'push' || inputs.dry_run == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Require a semantic release tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release workflows must run from a clean vX.Y.Z tag; got $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Run the release version and dependency gates
        run: sbt releaseVersionCheck releaseDependencyCheck
      - name: Re-run the complete correctness, optimized-link, and docs gates
        run: sbt testAllFull docsCheck

  package-jdk21:
    name: Stage signed JDK 21 artifacts
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Import the ephemeral signing key
        if: github.event_name == 'push'
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
        run: printf '%s' "$PGP_SECRET" | base64 --decode | gpg --batch --import
      - name: Stage the signed JDK 21 publication slice
        if: github.event_name == 'push'
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: sbt releaseJdk21Signed
      - name: Stage an unsigned dry-run JDK 21 slice
        if: github.event_name == 'workflow_dispatch'
        run: sbt releaseJdk21Unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: central-staging-jdk21
          path: target/sona-staging
          if-no-files-found: error

  package-jdk22:
    name: Stage signed JDK 22 artifacts
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "22"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Import the ephemeral signing key
        if: github.event_name == 'push'
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
        run: printf '%s' "$PGP_SECRET" | base64 --decode | gpg --batch --import
      - name: Stage the signed JDK 22 publication slice
        if: github.event_name == 'push'
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: sbt releaseJdk22Signed
      - name: Stage an unsigned dry-run JDK 22 slice
        if: github.event_name == 'workflow_dispatch'
        run: sbt releaseJdk22Unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: central-staging-jdk22
          path: target/sona-staging
          if-no-files-found: error

  assemble-and-upload:
    name: Validate one Central Portal bundle
    needs: [package-jdk21, package-jdk22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: central-staging-jdk21
          path: target/central-staging/jdk21
      - uses: actions/download-artifact@v4
        with:
          name: central-staging-jdk22
          path: target/central-staging/jdk22
      - name: Merge the disjoint JDK staging trees
        run: |
          mkdir -p target/central-bundle-tree
          cp -R target/central-staging/jdk21/. target/central-bundle-tree/
          cp -R target/central-staging/jdk22/. target/central-bundle-tree/
          (cd target/central-bundle-tree && zip -X -q -r ../central-bundle.zip .)
      - name: Verify the complete Maven layout and admitted coordinates
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tools/verify-central-bundle.sh --require-signatures target/central-bundle.zip
          else
            tools/verify-central-bundle.sh target/central-bundle.zip
          fi
      - name: Upload as a user-managed Central Portal deployment
        if: github.event_name == 'push'
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          token=$(printf '%s:%s' "$SONATYPE_USERNAME" "$SONATYPE_PASSWORD" | base64 | tr -d '\n')
          url="https://central.sonatype.com/api/v1/publisher/upload?name=Gale-${GITHUB_REF_NAME}&publishingType=USER_MANAGED"
          deployment=$(curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer $token" \
            --form "bundle=@target/central-bundle.zip" \
            "$url")
          {
            echo "### Central Portal deployment"
            echo "Uploaded in USER_MANAGED mode; publish it manually after Central validation."
            echo
            echo "Deployment ID: `$deployment`"
          } >> "$GITHUB_STEP_SUMMARY"
